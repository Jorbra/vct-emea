# Reads Liquipedia and vlr.gg for a few minutes (scripts/worker.mjs). Started by hand only: on the server, the scheduled
# task node scripts/tick.mjs does this work every minute from a local copy of the database, whereas this job read Turso
# itself and counted against its monthly read quota.
name: Read Liquipedia and vlr.gg
on:
  workflow_dispatch: {}
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
